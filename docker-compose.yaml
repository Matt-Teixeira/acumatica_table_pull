services:
  app:
    # USER_ID drives the tag: acu-sync:<username> for dev builds, acu-sync:svc
    # for the release copy (flipped by #RELEASE:USER_ID=svc at release time).
    # The baked gosu entrypoint drops to RUN_USER, so job-written files belong
    # to the service identity rather than a human deploy user.
    image: acu-sync:${USER_ID}
    build:
      context: .
      # Host identity comes from .env so this file stays host-agnostic and the
      # dev and staging branches can share it. See .env.example.
      args:
        USER_ID: ${USER_ID}
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    # No env_file here: the app loads .env itself via dotenv (index.js), which
    # strips quotes and does NOT expand $ — so the Acumatica URIs with
    # $expand/$format reach the app intact.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Intentionally unset in .env: empty -> entrypoint.sh defaults to svc,
      # so ONE place decides the production identity. Dev runs pass it on the
      # command line. ':-' silences the compose WARN.
      RUN_USER: ${RUN_USER:-}
      NPM_CONFIG_CACHE: /tmp/.npm
    working_dir: /workspace
    volumes:
      # Project source — live edits on host reflect in container. node_modules
      # is IN-TREE (installed by build.sh as the host user), so it rides along
      # in this mount. The shared /opt/resources/node_mod_cache mount is
      # retired (monday precedent, 2026-08-25): each copy (dev clone, release)
      # owns its own deps.
      - ./:/workspace

      # Read-only host resources (SSL CA for Postgres at PG_SSL_PATH)
      - /opt/resources:/opt/resources:ro
    networks:
      - pg_net

networks:
  pg_net:
    external: true
