services:
  app:
    image: node:lts
    # Run as host UID : docker GID so bind-mounted files stay editable on the
    # host and the shared /opt dirs (group docker, setgid) stay writable.
    # UID = `id -u` of the deploy user; GID = `getent group docker`.
    user: "1006:987"
    # No env_file here: the app loads .env itself via dotenv (index.js), which
    # strips quotes and does NOT expand $ — so the Acumatica URIs with
    # $expand/$format reach the app intact.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # HOME for a non-baked user id; keeps npm/node from writing to /
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
    working_dir: /workspace
    volumes:
      # Project source - live edits on host reflect in container
      - ./:/workspace

      # Persistent node_modules cache (survives container removal)
      - /opt/resources/node_mod_cache/acumatica_sync:/workspace/node_modules

      # Centralized run logs
      - /opt/run-logs/acumatica_sync:/opt/run-logs/acumatica_sync
    networks:
      - pg_net

networks:
  pg_net:
    external: true
